  <title id="title">Expository canonical v1: square cropped horizontal-only echoes</title>
  <desc id="desc">Approved Expository v1 square icon crop of the canonical horizontal-only magnifier and pastel disk stack.</desc>
  <!-- Canonical horizontal-only composition. Every coloured echo references the exact same
       #magnifier path as the white foreground; inner disk stack retains its original tilt.
       Display-coordinate echo offsets: red +69.12, blue +138.24, yellow +207.36 horizontally.
       No relative rotation or vertical offset. Because the exterior uses the transpose
       matrix (0 1 1 0 0 0), internal SVG translations are along Y.
       The square icon is a crop (viewBox only); do not alter the common geometry.
       Approved canonical v1; earlier diagonal/rotated designs are archived. -->
