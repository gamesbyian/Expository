  <title id="title">Expository, four-colour magnifying glass</title>
  <desc id="desc">A white magnifying glass with precisely rotated and offset red, blue, and yellow silhouettes on black.</desc>
  <!-- Editable construction:
       Lens pivot: (546.102, 466.631) in original 1536 x 1536 source coordinates.
       Every silhouette references the SAME geometry; no shadow is redrawn.
       Increment: +19 degrees clockwise, +138.24 units horizontally and vertically (9% of 1536).
       SVG transforms execute right-to-left: first rotate about lens pivot, then translate.
       Layer angles and offsets are absolute from white, not cumulative floating-point approximations.
       Edit the three <use> transforms to change placement. Edit #magnifier to change all four outlines.
       A final black lens knockout maintains a clear, black opening as in the supplied design.
       Framing is enlarged to retain the entire corrected yellow handle.
  -->
