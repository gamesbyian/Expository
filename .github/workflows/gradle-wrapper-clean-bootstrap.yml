name: Official Gradle wrapper clean-cache bootstrap
# A narrow opt-in or path-scoped acceptance of the real Gradle distribution.
# Does not resolve app/Android dependencies or touch trusted shared caches.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/gradle-wrapper-fresh-bootstrap.sh'
      - '.github/workflows/gradle-wrapper-clean-bootstrap.yml'
permissions:
  contents: read
jobs:
  clean-official-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download, verify and launch pinned official ZIP in empty Gradle User Home
        shell: bash
        run: bash scripts/gradle-wrapper-fresh-bootstrap.sh
