name: Expository Transfer targeted PR Android compile
# A trusted maintainer comment can request compiling the *actual* PR head.
# No production credentials, writable tokens, automatic CI or fork execution.
on:
  workflow_call:
permissions:
  contents: read
jobs:
  android-pr-debug:
    if: >-
      github.event.issue.pull_request != null &&
      github.event.comment.user.login == 'gamesbyian' &&
      github.event.comment.body == '/transfer-native apk-pr'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Resolve immutable same-repository PR head
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          details="$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '[.head.repo.full_name, .head.sha] | join("|")')"
          IFS='|' read -r origin sha <<< "$details"
          if [[ "$origin" != "$REPO" || ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Unsafe or unresolved PR source; refusing build"
            exit 2
          fi
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
          echo "Resolved same-repository immutable PR source."
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - name: Install scoped SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
          cache-read-only: true
      - name: Compile selected PR head app and instrumentation test APKs
        working-directory: android-transfer
        run: gradle -PwithAndroid=true :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon
      - name: Package named source-pinned debug and instrumentation APKs
        working-directory: android-transfer
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          output="app/build/outputs/apk/debug"
          printf '%s  source-commit\n' "$SOURCE_SHA" > "$output/SOURCE-SHA.txt"
          mapfile -t test_apks < <(find app/build/outputs/apk/androidTest -type f -name '*androidTest*.apk' | sort)
          if [ "${#test_apks[@]}" -ne 1 ]; then
            echo "Expected exactly one compiled instrumentation APK"
            exit 2
          fi
          app_name="expository-ftp-pr-${PR_NUMBER}-debug.apk"
          test_name="expository-ftp-pr-${PR_NUMBER}-androidTest.apk"
          cp "$output/app-debug.apk" "$output/$app_name"
          cp "${test_apks[0]}" "$output/$test_name"
          (cd "$output" && sha256sum "$app_name" "$test_name" > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: expository-ftp-pr-${{ github.event.issue.number }}-debug
          path: |
            android-transfer/app/build/outputs/apk/debug/expository-ftp-pr-${{ github.event.issue.number }}-debug.apk
            android-transfer/app/build/outputs/apk/debug/expository-ftp-pr-${{ github.event.issue.number }}-androidTest.apk
            android-transfer/app/build/outputs/apk/debug/SHA256SUMS.txt
            android-transfer/app/build/outputs/apk/debug/SOURCE-SHA.txt
          retention-days: 5
