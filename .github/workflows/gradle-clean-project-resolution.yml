name: Clean JVM and Android dependency resolution
# Explicit and narrow. Never runs for ordinary PRs unrelated to this fixture.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/gradle-clean-project-resolution.sh'
      - '.github/workflows/gradle-clean-project-resolution.yml'
permissions:
  contents: read
concurrency:
  group: expository-clean-deps-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  clean-project-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - name: Install only the compile SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Resolve all JVM and Android compile dependencies from an empty Gradle home
        shell: bash
        run: bash scripts/gradle-clean-project-resolution.sh
