name: Gradle wrapper genuine checksum rejection
# Executes a local, disposable, valid ZIP with a deliberately false SHA256.
# This opt-in/scope-limited negative is distinct from static property tests.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/gradle-wrapper-negative-lab.sh'
      - '.github/workflows/gradle-wrapper-checksum-negative.yml'
permissions:
  contents: read
jobs:
  real-wrapper-negative:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run authentic GradleWrapperMain against an isolated false ZIP checksum
        shell: bash
        run: bash scripts/gradle-wrapper-negative-lab.sh
