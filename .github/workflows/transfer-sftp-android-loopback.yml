name: Expository Transfer Android loopback SFTP relay
# Exact PR source, API35 Android TCP/SSH and disposable in-app test cache.
# No user files, credentials, external hosts or production environment secrets.
on:
  pull_request:
    paths:
      - "android-transfer/app/src/androidTest/java/dev/expository/transfer/SftpRelayAndroidLoopbackTest.kt"
      - "android-transfer/app/build.gradle.kts"
      - ".github/workflows/transfer-sftp-android-loopback.yml"
permissions:
  contents: read

# Only superseded automatic PR evidence may be cancelled.
# workflow_dispatch uses its unique run ID; independent manual requests survive.
concurrency:
  group: transfer-sftp-loopback-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  android-sftp-loopback:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - name: Install Android 36 compile SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.13"
          cache-read-only: true
      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run exactly one real Android pinned-SFTP relay fixture
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: cd android-transfer && gradle -PwithAndroid=true -Pandroid.testInstrumentationRunnerArguments.class=dev.expository.transfer.SftpRelayAndroidLoopbackTest :app:connectedDebugAndroidTest --no-daemon
      - name: Retain synthetic test report and exact source SHA
        if: always()
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p android-transfer/app/build/sftp-loopback-evidence
          printf '%s\n' "$SOURCE_SHA" > android-transfer/app/build/sftp-loopback-evidence/PR-SHA.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: expository-ftp-android-sftp-loopback
          path: |
            android-transfer/app/build/sftp-loopback-evidence/PR-SHA.txt
            android-transfer/app/build/reports/androidTests/connected/**
            android-transfer/app/build/outputs/androidTest-results/connected/**
          if-no-files-found: ignore
          retention-days: 5
