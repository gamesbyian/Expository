name: Expository Transfer native validation
# Owner-authorized PR comments may trigger isolated labs/APK using reviewed
# main only. No secrets in these jobs and no untrusted PR-head execution.
on:
  workflow_call:
  pull_request:
    paths:
      - "android-transfer/**"
      - "!android-transfer/**/*.md"
      - "!android-transfer/*.md"
      - ".github/workflows/transfer-*.yml"
      - "scripts/ci-selection.cjs"
      - "tests/ci-selection.test.cjs"
  workflow_dispatch:
    inputs:
      build_apk:
        description: "Opt-in SDK download and signed developer debug APK"
        type: boolean
        default: false
      ftps_lab:
        description: "Opt-in isolated FTPS TLS server and read proof"
        type: boolean
        default: false
      sftp_lab:
        description: "Opt-in SFTP pinned-key live synthetic lab"
        type: boolean
        default: false
permissions:
  contents: read
# Replace stale cheap PR validation when a newer commit arrives, but never
# cancel an explicitly requested trusted-main lab, emulator or APK dispatch.
concurrency:
  group: transfer-native-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  planner:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        id: source
        with:
          # PR refs/pull/N/merge disappears quickly after squash merge.
          # Validate the immutable PR head instead of racing its merge ref.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Fetch PR change metadata, including rename origins
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/pulls/$NUMBER/files?per_page=100" --jq '.[] | {filename, previous_filename, status} | @json' > "$RUNNER_TEMP/expository-pr-files.jsonl"
      - name: Select risk-appropriate verification
        id: affected
        run: node scripts/ci-selection.cjs "$RUNNER_TEMP/expository-pr-files.jsonl"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: steps.affected.outputs.jvm == 'true'
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        if: steps.affected.outputs.jvm == 'true'
        with:
          gradle-version: "8.13"
      - name: Run all applicable offline JVM suites
        id: jvm-tests
        if: steps.affected.outputs.jvm == 'true'
        working-directory: android-transfer
        shell: bash
        run: |
          set -o pipefail
          gradle check --no-daemon 2>&1 | tee "$RUNNER_TEMP/expository-jvm.log"
      - name: Record explicit JVM non-applicability
        if: steps.affected.outputs.jvm == 'false'
        run: echo "No JVM/native build impact in the recorded PR paths; check was NOT executed." >> "$GITHUB_STEP_SUMMARY"

      - name: Publish safe JVM failure digest
        if: failure() && steps.source.outcome == 'success'
        env:
          CI_SUITE: android-jvm
          CI_TESTED_SHA: ${{ github.event.pull_request.head.sha }}
          CI_CHECK_OUTCOME: ${{ steps.jvm-tests.outcome }}
          CI_LOG_PATH: ${{ runner.temp }}/expository-jvm.log
          CI_REPRO: gradle check --no-daemon
        run: node scripts/ci-failure-digest.cjs
      - name: Attach sanitized JVM failure JSON
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: expository-native-jvm-failure-digest
          path: ci-failure-digest.json
          if-no-files-found: ignore
          retention-days: 5

  android-pr-compile:
    # Every app-affecting PR must compile its app AND instrumentation sources.
    # Pure documentation and unrelated native-only changes keep the cheap JVM lane.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        id: source
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Fetch exact PR paths, including rename origins
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/pulls/$NUMBER/files?per_page=100" --jq '.[] | {filename, previous_filename, status} | @json' > "$RUNNER_TEMP/expository-pr-files.jsonl"
      - name: Select Android compile and instrumentation gate
        id: affected
        run: node scripts/ci-selection.cjs "$RUNNER_TEMP/expository-pr-files.jsonl"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: steps.affected.outputs.android == 'true'
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        if: steps.affected.outputs.android == 'true'
      - name: Install only the required compile SDK
        if: steps.affected.outputs.android == 'true'
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        if: steps.affected.outputs.android == 'true'
        with:
          gradle-version: "8.13"
          cache-read-only: true
      - name: Compile app and Android tests, then lint (no emulator or external endpoints)
        id: android-build
        if: steps.affected.outputs.android == 'true'
        working-directory: android-transfer
        shell: bash
        run: |
          set -o pipefail
          gradle -PwithAndroid=true :app:compileDebugKotlin :app:compileDebugAndroidTestKotlin :app:lintDebug --no-daemon 2>&1 | tee "$RUNNER_TEMP/expository-android.log"
      - name: Record explicit Android non-applicability
        if: steps.affected.outputs.android == 'false'
        run: echo "No Android compile impact in the recorded PR paths; check was NOT executed." >> "$GITHUB_STEP_SUMMARY"

      - name: Publish safe Android failure digest
        if: failure() && steps.source.outcome == 'success'
        env:
          CI_SUITE: android
          CI_TESTED_SHA: ${{ github.event.pull_request.head.sha }}
          CI_CHECK_OUTCOME: ${{ steps.android-build.outcome }}
          CI_LOG_PATH: ${{ runner.temp }}/expository-android.log
          CI_REPRO: gradle -PwithAndroid=true :app:compileDebugKotlin :app:compileDebugAndroidTestKotlin :app:lintDebug --no-daemon
        run: node scripts/ci-failure-digest.cjs
      - name: Attach sanitized Android failure JSON
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: expository-native-android-failure-digest
          path: ci-failure-digest.json
          if-no-files-found: ignore
          retention-days: 5

  android-debug:
    # Developer debug APK artifacts remain opt-in; the app compile/lint PR gate above is mandatory when applicable.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.build_apk) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       github.event.comment.user.login == 'gamesbyian' &&
       github.event.comment.body == '/transfer-native apk')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'issue_comment' && 'main' || github.ref }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - name: Install scoped SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.13"
      - name: Build developer-only signed debug APK
        working-directory: android-transfer
        run: gradle -PwithAndroid=true :app:assembleDebug --no-daemon
      - name: Give the distributable APK an unambiguous filename
        working-directory: android-transfer
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/expository-ftp-developer-debug.apk
      - name: Record artifact SHA256 (not a release signature)
        working-directory: android-transfer/app/build/outputs/apk/debug
        run: sha256sum expository-ftp-developer-debug.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: expository-ftp-developer-debug-apk
          path: |
            android-transfer/app/build/outputs/apk/debug/expository-ftp-developer-debug.apk
            android-transfer/app/build/outputs/apk/debug/SHA256SUMS.txt
          retention-days: 5

  ftps-lab:
    # Ephemeral TLS verification, intentionally opt-in only (lean PR CI).
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.ftps_lab) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       github.event.comment.user.login == 'gamesbyian' &&
       github.event.comment.body == '/transfer-native ftps-lab')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'issue_comment' && 'main' || github.ref }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.13"
      - name: Install bounded synthetic FTP server dependencies
        run: python3 -m pip install --user pyftpdlib==2.1.0 pyOpenSSL==25.3.0
      - name: Create ephemeral SAN certificate and inert fixture
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ftps-lab/fixture"
          printf 'FTPS synthetic fixture\n' > "$RUNNER_TEMP/ftps-lab/fixture/synthetic.txt"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout "$RUNNER_TEMP/ftps-lab/key.pem" \
            -out "$RUNNER_TEMP/ftps-lab/cert.pem" \
            -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
          keytool -importcert -noprompt -alias synthetic-ftps \
            -file "$RUNNER_TEMP/ftps-lab/cert.pem" \
            -keystore "$RUNNER_TEMP/ftps-lab/truststore.p12" \
            -storetype PKCS12 -storepass changeit
      - name: Start localhost TLS-only disposable server
        shell: bash
        run: |
          export FTPS_FIXTURE_ROOT="$RUNNER_TEMP/ftps-lab/fixture"
          export FTPS_TEST_CERT="$RUNNER_TEMP/ftps-lab/cert.pem"
          export FTPS_TEST_KEY="$RUNNER_TEMP/ftps-lab/key.pem"
          python3 -u android-transfer/adapter/ftps/testing/ftps_server.py > "$RUNNER_TEMP/ftps-lab/server.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/ftps-lab/server.pid"
          for attempt in $(seq 1 30); do
            if python3 -c 'import socket; c=socket.create_connection(("127.0.0.1",2121),1); c.close()' 2>/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Synthetic FTPS server did not start"
          if test -f "$RUNNER_TEMP/ftps-lab/server.log"; then
            echo "--- synthetic server startup diagnostics ---"
            cat "$RUNNER_TEMP/ftps-lab/server.log"
            echo "--- end startup diagnostics ---"
          fi
          exit 1
      - name: Reject untrusted self-signed FTPS certificate
        working-directory: android-transfer
        run: gradle :adapter:ftps:lab -PftpsLabMode=reject-untrusted --no-daemon
      - name: Trust explicit lab certificate and prove encrypted file read
        working-directory: android-transfer
        run: gradle :adapter:ftps:lab -PftpsLabMode=trusted-read -PftpsTrustStore="$RUNNER_TEMP/ftps-lab/truststore.p12" --no-daemon

  sftp-lab:
    # Ephemeral pinned-key protocol lab, opt-in only after bootstrap proof.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.sftp_lab) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       github.event.comment.user.login == 'gamesbyian' &&
       github.event.comment.body == '/transfer-native sftp-lab')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'issue_comment' && 'main' || github.ref }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.13"
      - name: Trust-approved ephemeral SFTP host fingerprint, reject changed key
        working-directory: android-transfer
        run: gradle :adapter:sftp:lab --no-daemon
