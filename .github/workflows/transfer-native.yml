            echo "jvm=true" >> "$GITHUB_OUTPUT"
            echo "android=true" >> "$GITHUB_OUTPUT"
            echo "Incomplete PR metadata ($observed/$total); conservative full verification." >> "$GITHUB_STEP_SUMMARY"
          else
            node scripts/ci-selection.cjs "$RUNNER_TEMP/expository-pr-files.jsonl"
            echo "Verified $observed/$total changed paths including rename origins." >> "$GITHUB_STEP_SUMMARY"
          fi
          newest="$(gh api "repos/$REPO/pulls/$NUMBER" --jq '.head.sha')"
          if [[ "$newest" != "$EVENT_HEAD" ]]; then
            echo "::error::PR head changed during selection; refusing stale evidence"; exit 2
          fi
          echo "Base-trusted selector; exact PR source $EVENT_HEAD." >> "$GITHUB_STEP_SUMMARY"

  planner:
    name: planner
    needs: select
    if: >-
      (github.event_name == 'pull_request' || github.event_name == 'merge_group') &&
      needs.select.outputs.jvm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        id: source
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
