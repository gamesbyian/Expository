          done
          echo "Synthetic FTPS server did not start"
          if test -f "$RUNNER_TEMP/ftps-lab/server.log"; then
            echo "--- synthetic server startup diagnostics ---"
            cat "$RUNNER_TEMP/ftps-lab/server.log"
            echo "--- end startup diagnostics ---"
          fi
          exit 1
      - name: Reject untrusted self-signed FTPS certificate
        working-directory: android-transfer
        run: gradle :adapter:ftps:lab -PftpsLabMode=reject-untrusted --no-daemon
      - name: Trust explicit lab certificate and prove encrypted file read
        working-directory: android-transfer
        run: gradle :adapter:ftps:lab -PftpsLabMode=trusted-read -PftpsTrustStore="$RUNNER_TEMP/ftps-lab/truststore.p12" --no-daemon

  sftp-lab:
    # Ephemeral pinned-key protocol lab, opt-in only after bootstrap proof.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.sftp_lab) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       github.event.comment.user.login == 'gamesbyian' &&
       github.event.comment.body == '/transfer-native sftp-lab')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'issue_comment' && 'main' || github.ref }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.13"
      - name: Trust-approved ephemeral SFTP host fingerprint, reject changed key
        working-directory: android-transfer
        run: gradle :adapter:sftp:lab --no-daemon
