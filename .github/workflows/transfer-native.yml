          CI_CHECK_OUTCOME: ${{ steps.jvm-tests.outcome }}
          CI_LOG_PATH: ${{ runner.temp }}/expository-jvm.log
          CI_REPRO: gradle check --no-daemon
        run: node scripts/ci-failure-digest.cjs
      - name: Attach sanitized JVM failure JSON
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: expository-native-jvm-failure-digest
          path: ci-failure-digest.json
          if-no-files-found: ignore
          retention-days: 5

  android-pr-compile:
    name: android-pr-compile
    needs: select
    if: >-
      (github.event_name == 'pull_request' || github.event_name == 'merge_group') &&
      needs.select.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
