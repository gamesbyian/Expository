name: Expository Transfer manual external smoke
# Maintainer-only exact PR comment commands run trusted main code, never PR-head
# code. No automatic push, PR, or scheduled external test traffic.
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      profile:
        description: "Read-only target and secure protocol (never plaintext FTP)"
        required: true
        type: choice
        default: rebex-explicit
        options:
          - rebex-explicit
          - rebex-tls12
          - rebex-implicit
          - wing-implicit
          - rebex-sftp
          - wing-sftp
          - owner-explicit
          - owner-implicit
          - owner-sftp
      sftp_pin:
        description: "For SFTP only: independently verified exact SHA256: host-key fingerprint"
        required: false
        type: string
permissions:
  contents: read

jobs:
  public-smoke:
    if: >-
      (github.event_name == 'workflow_dispatch' && !startsWith(inputs.profile, 'owner-')) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       github.event.comment.user.login == 'gamesbyian' &&
       (github.event.comment.body == '/transfer-smoke rebex-explicit' ||
        github.event.comment.body == '/transfer-smoke rebex-implicit' ||
        github.event.comment.body == '/transfer-smoke rebex-tls12' ||
        github.event.comment.body == '/transfer-smoke wing-implicit'))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      EXPOSITORY_SMOKE_REQUEST: ${{ github.event_name == 'issue_comment' && github.event.comment.body || inputs.profile }}
      EXPOSITORY_SMOKE_SFTP_PIN: ${{ inputs.sftp_pin }}
    steps:
      - name: Allowlist profile before running any external command
        shell: bash
        run: |
          case "$EXPOSITORY_SMOKE_REQUEST" in
            rebex-explicit|'/transfer-smoke rebex-explicit') target=rebex-explicit ;;
            rebex-tls12|'/transfer-smoke rebex-tls12') target=rebex-tls12 ;;
            rebex-implicit|'/transfer-smoke rebex-implicit') target=rebex-implicit ;;
            wing-implicit|'/transfer-smoke wing-implicit') target=wing-implicit ;;
            rebex-sftp) target=rebex-sftp ;;
            wing-sftp) target=wing-sftp ;;
            *) echo "Unsupported public profile"; exit 2 ;;
          esac
          printf 'EXPOSITORY_SMOKE_TARGET=%s\n' "$target" >> "$GITHUB_ENV"
      # issue_comment workflows always execute the reviewed default branch, never
      # an unreviewed pull request head; explicit ref avoids event ambiguity.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Read-only real protocol check (bounded and no raw server logs)
        working-directory: android-transfer
        shell: bash
        run: |
          case "$EXPOSITORY_SMOKE_TARGET" in
            rebex-explicit|rebex-tls12|rebex-implicit|wing-implicit)
              gradle :adapter:ftps:externalSmoke --no-daemon --quiet ;;
            rebex-sftp|wing-sftp)
              test -n "$EXPOSITORY_SMOKE_SFTP_PIN" || {
                echo "SFTP host-key pin required from an independently trusted source"; exit 2;
              }
              gradle :adapter:sftp:externalSmoke --no-daemon --quiet ;;
            *) echo "Unsupported read-only public profile"; exit 2 ;;
          esac

  owner-smoke:
    if: >-
      (github.event_name == 'workflow_dispatch' && startsWith(inputs.profile, 'owner-')) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       github.event.comment.user.login == 'gamesbyian' &&
       (github.event.comment.body == '/transfer-smoke owner-explicit' ||
        github.event.comment.body == '/transfer-smoke owner-implicit'))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    # Password stays a GitHub Actions secret. The owner host/account are
    # recovered from an IMMUTABLE public S60 commit with strict parsing.
    env:
      EXPOSITORY_SMOKE_REQUEST: ${{ github.event_name == 'issue_comment' && github.event.comment.body || inputs.profile }}
      EXPOSITORY_SMOKE_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      EXPOSITORY_SMOKE_SFTP_PIN: ${{ inputs.sftp_pin }}
    steps:
      - name: Allowlist private target before accessing credentials
        shell: bash
        run: |
          case "$EXPOSITORY_SMOKE_REQUEST" in
            owner-explicit|'/transfer-smoke owner-explicit') target=owner-explicit ;;
            owner-implicit|'/transfer-smoke owner-implicit') target=owner-implicit ;;
            owner-sftp) target=owner-sftp ;;
            *) echo "Unsupported owner profile"; exit 2 ;;
          esac
          printf 'EXPOSITORY_SMOKE_TARGET=%s\n' "$target" >> "$GITHUB_ENV"
      - name: Recover publicly documented owner host/account from pinned S60
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          import urllib.request

          # Immutable S60 commit; never fetch a moving branch to route secrets.
          url = "https://raw.githubusercontent.com/gamesbyian/S60/417fec65458c500da903184118bf701086161006/.github/workflows/ftp-inventory.yml"
          with urllib.request.urlopen(url, timeout=12) as response:
              body = response.read(100_001)
          if len(body) > 100_000:
              raise RuntimeError("S60_CONFIG_SIZE_LIMIT")
          source = body.decode("utf-8")
          host = re.findall(r"^\s*FTP_HOST:\s*([a-zA-Z0-9.-]+)\s*$", source, flags=re.M)
          account = re.findall(r"^\s*FTP_USER:\s*([a-zA-Z0-9._-]+)\s*$", source, flags=re.M)
          if len(host) != 1 or len(account) != 1 or not host[0].endswith(".seedhost.eu"):
              raise RuntimeError("S60_CONFIG_REFERENCE_INVALID")
          # GitHub Actions echoes job environment variables at each step.
          # Mask these connection labels before exporting them for later steps.
          print("::add-mask::" + host[0], flush=True)
          print("::add-mask::" + account[0], flush=True)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write("EXPOSITORY_SMOKE_HOST=" + host[0] + "\n")
              handle.write("EXPOSITORY_SMOKE_USER=" + account[0] + "\n")
          print("Pinned S60 connection metadata loaded; host and account redacted.")
          PY
      - name: Fail closed on missing private configuration
        shell: bash
        run: |
          if test -z "$EXPOSITORY_SMOKE_HOST" || test -z "$EXPOSITORY_SMOKE_USER" || test -z "$EXPOSITORY_SMOKE_PASSWORD"; then
            echo "Owner target not configured (pinned S60 metadata and FTP_PASSWORD secret required)"
            exit 2
          fi
          if test "$EXPOSITORY_SMOKE_TARGET" = owner-sftp && test -z "$EXPOSITORY_SMOKE_SFTP_PIN"; then
            echo "Independently verified SSH fingerprint required"
            exit 2
          fi
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Owner authorized root listing only (no remote content or mutation)
        working-directory: android-transfer
        shell: bash
        run: |
          case "$EXPOSITORY_SMOKE_TARGET" in
            owner-explicit|owner-implicit)
              gradle :adapter:ftps:externalSmoke --no-daemon --quiet ;;
            owner-sftp)
              gradle :adapter:sftp:externalSmoke --no-daemon --quiet ;;
            *) echo "Unsupported owner profile"; exit 2 ;;
          esac
