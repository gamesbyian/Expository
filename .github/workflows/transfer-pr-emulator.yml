name: Expository Transfer targeted PR Android emulator
# A deliberate, owner-authored command tests an immutable same-repository PR
# source revision. Workflow file comes from reviewed main, not the PR.
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
jobs:
  android-pr-emulator:
    if: >-
      github.event.issue.pull_request != null &&
      github.event.comment.user.login == 'gamesbyian' &&
      (github.event.comment.body == '/transfer-native emulator-pr' ||
       startsWith(github.event.comment.body, '/transfer-native emulator-pr '))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Verify same-repository PR and pin exact source SHA
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          metadata="$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '[.head.repo.full_name, .head.sha] | join("|")')"
          IFS='|' read -r origin sha <<< "$metadata"
          if [[ "$origin" != "$REPO" || ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Fork or ambiguous PR source forbidden for emulator run"; exit 2
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Pinned a reviewed-repository PR commit for emulator execution."
      - name: Select a safe optional test class
        shell: bash
        env:
          REQUEST: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          if [[ "$REQUEST" == "/transfer-native emulator-pr" ]]; then
            echo "TARGET_TEST_CLASS=" >> "$GITHUB_ENV"
            echo "Full Android instrumentation suite selected."
          else
            name="${REQUEST#'/transfer-native emulator-pr '}"
            case "$name" in
              AndroidContentProviderCopyTest|FtpsUiSmokeTest|LocalPickerCancelSmokeTest|LocalPickerPositiveCopyTest|LocalPickerSourceSelectionTest|RenamePreviewUiSmokeTest|WorkspaceNavigationUiTest|RecoveryRefreshUiTest|RecoveryIndexFailurePolicyTest) ;;
              *) echo "Unsupported test selection"; exit 2 ;;
            esac
            printf 'TARGET_TEST_CLASS=dev.expository.transfer.%s\\n' "$name" >> "$GITHUB_ENV"
            echo "A single approved instrumentation class selected."
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install API 36 compile SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-read-only: true
      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Execute scoped or full synthetic Android tests against the PR
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            cd android-transfer
            if [ -z "$TARGET_TEST_CLASS" ]; then
              gradle -PwithAndroid=true :app:connectedDebugAndroidTest --no-daemon
            else
              gradle -PwithAndroid=true -Pandroid.testInstrumentationRunnerArguments.class="$TARGET_TEST_CLASS" :app:connectedDebugAndroidTest --no-daemon
            fi
      - name: Publish synthetic report and tested SHA
        if: always()
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          mkdir -p android-transfer/app/build/emulator-pr-provenance
          printf '%s\n' "$SOURCE_SHA" > android-transfer/app/build/emulator-pr-provenance/PR-SHA.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expository-transfer-pr-${{ github.event.issue.number }}-emulator
          path: |
            android-transfer/app/build/emulator-pr-provenance/PR-SHA.txt
            android-transfer/app/build/reports/androidTests/connected/**
            android-transfer/app/build/outputs/androidTest-results/connected/**
          if-no-files-found: ignore
          retention-days: 5
