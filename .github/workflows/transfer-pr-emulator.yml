name: Expository Transfer targeted PR Android emulator
# A deliberate, owner-authored command tests an immutable same-repository PR
# source revision. Workflow file comes from reviewed main, not the PR.
on:
  workflow_call:
permissions:
  contents: read
jobs:
  android-pr-emulator:
    if: >-
      github.event.issue.pull_request != null &&
      github.event.comment.user.login == 'gamesbyian' &&
      (github.event.comment.body == '/transfer-native emulator-pr' ||
       startsWith(github.event.comment.body, '/transfer-native emulator-pr '))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Verify same-repository PR and pin exact source SHA
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          metadata="$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '[.head.repo.full_name, .head.sha] | join("|")')"
          IFS='|' read -r origin sha <<< "$metadata"
          if [[ "$origin" != "$REPO" || ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Fork or ambiguous PR source forbidden for emulator run"; exit 2
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Pinned a reviewed-repository PR commit for emulator execution."
      - name: Select a safe optional test class or synthetic batch
        shell: bash
        env:
          REQUEST: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          if [[ "$REQUEST" == "/transfer-native emulator-pr" ]]; then
            echo "TARGET_TEST_CLASS=" >> "$GITHUB_ENV"
            echo "Full Android instrumentation suite selected."
          else
            name="${REQUEST#'/transfer-native emulator-pr '}"
            if [[ "$name" == *,* ]]; then
              # Batch only independent synthetic classes: no DocumentsUI, shared OS
              # picker state, or method selectors. Comma-separated input is data,
              # never shell or Gradle syntax.
              if [[ ! "$name" =~ ^[A-Za-z][A-Za-z0-9]*(,[A-Za-z][A-Za-z0-9]*)+$ ]]; then
                echo "Malformed synthetic batch selector"; exit 2
              fi
              IFS=',' read -r -a selection <<< "$name"
              if (( ${#selection[@]} < 2 || ${#selection[@]} > 5 )); then
                echo "Synthetic batches require two through five classes"; exit 2
              fi
              declare -A seen=()
              for class in "${selection[@]}"; do
                case "$class" in
                  LocalTreePresentationAndroidTest|SafRecursiveScannerAndroidTest|SafRecursiveTreeCopyAndroidTest|RecoveryIndexFailurePolicyTest|GithubPublicDirectoryAndroidTest) ;;
                  *) echo "Synthetic batch class not allowlisted"; exit 2 ;;
                esac
                if [[ -n "${seen[$class]:-}" ]]; then
                  echo "Duplicate synthetic batch class"; exit 2
                fi
                seen[$class]=1
              done
              qualified="$(printf 'dev.expository.transfer.%s,' "${selection[@]}")"
              printf 'TARGET_TEST_CLASS=%s\n' "${qualified%,}" >> "$GITHUB_ENV"
              echo "Selected ${#selection[@]} synthetic classes in one instrumentation invocation."
            else
              case "$name" in
                AndroidContentProviderCopyTest|FtpsUiSmokeTest|LocalPickerCancelSmokeTest|LocalPickerPositiveCopyTest|LocalPickerSourceSelectionTest|LocalSharesheetSmokeTest|RenamePreviewUiSmokeTest|KeystoreProfileVaultTest|WorkspaceNavigationUiTest|SftpRelayAndroidLoopbackTest|RecoveryRefreshUiTest|RecoveryIndexFailurePolicyTest|GithubPublicDirectoryAndroidTest) ;;
                # One fixed Android DocumentsUI acceptance method. No arbitrary
                # method, package, sh fragment or wildcard is allowed.
                LocalPickerPositiveCopyTest#twoRealSystemPickedTreesCopyExactBytesAndPreserveSource) ;;
                # Single's actual OS Open->Create Document journey, isolated
                # from sibling Dual picker tests to avoid shared DocumentsUI state.
                LocalPickerPositiveCopyTest#selectAndSaveNewDocumentWithByteVerifiedReadback) ;;
                # The original source must never switch mid-Save As after Share.
                LocalPickerPositiveCopyTest#incomingShareDuringSaveAsCannotSwitchTheSource) ;;
                # One isolated foreground Copy state gate, avoiding the known
                # intermittent DocumentsUI navigation tests on this runner.
                LocalPickerCancelSmokeTest#localCopyLateProgressDoesNotCrossCancellationOrAttemptBoundaries) ;;
                # Exact bounded two-file Android Files picker + two receipts.
                LocalPickerPositiveCopyTest#twoRealSystemPickedTreesCopyTwoSelectedFiles) ;;
                NewFolderPositiveProviderTest#oneRealSystemPickedFolderCreatesExactChildAndVerifiedJournal) ;;
                # Exact DocumentsProvider workspace selection UI, independently
                # from the known-intermittent OS folder picker E2 (#222).
                WorkspaceNavigationUiTest#documentProviderIsSelectableInSingleAndDualWithoutImplicitWrites) ;;
                # Two EXACT genuine OS-picker Smart Merge journeys. Isolating
                # each method prevents prior disposable-provider test writes
                # contaminating counts and avoids paying for unrelated tests.
                # No arbitrary picker method or unreviewed shell fragment.
                RecursiveRealPickerCopyUiTest#genuineThirdSystemPickerInspectsMergeDestinationWithoutWriting) ;;
                RecursiveRealPickerCopyUiTest#genuineIndependentPickerRootsIllustrateActualCasefoldCollisionsWithoutWrites) ;;
                # Independent 2-source, >12-collision paging E2 with real
                # DocumentsUI grants and disposable provider fixtures.
                RecursiveRealPickerCopyUiTest#genuinePagedCasefoldReviewWithManyCollisionsAndNoWrites) ;;
                # Bounded synthetic provider display-only/recursive scan regression; no
                # external server, picker authorization or file mutation.
                ComposeSemanticsLifecycleUiTest|DualPickerLifecycleIsolationUiTest|LocalTreePresentationAndroidTest|SafRecursiveScannerAndroidTest|SafRecursiveTreeCopyAndroidTest|RecursiveFolderCopyOfferUiTest|RecursiveRealPickerCopyUiTest|DualRecursiveRealPickerCopyUiTest|WorkspaceNavigationUiTest#localTreeDisplayFilterDoesNotChangeSourceOrSelection) ;;
                *) echo "Unsupported test selection"; exit 2 ;;
              esac
              printf 'TARGET_TEST_CLASS=dev.expository.transfer.%s\n' "$name" >> "$GITHUB_ENV"
              echo "One exactly allowlisted instrumentation class or method selected."
            fi
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - name: Install API 36 compile SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.13'
          cache-read-only: true
      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Execute scoped or full synthetic Android tests against the PR
        # A real API35 test failed and 'adb emu kill' returned in run #41619692640,
        # but emulator-runner hung for ~23 minutes afterward. Bound just this
        # step to let diagnostics and artifacts run even if cleanup stalls.
        # An unscoped full suite retains its longer execution allowance.
        timeout-minutes: ${{ github.event.comment.body == '/transfer-native emulator-pr' && 28 || 14 }}
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          # The runner invokes one script string via sh -c; do not use a
          # multi-line if block. The optional class was already allowlisted.
          # Real OS-picker E2 needs its providers installed as an independent
          # APK, including EXACT reviewed Class#method selections. Providers
          # inside androidTest are not reliably discoverable
          # as DocumentsUI roots. For other scoped classes, skip the fixture.
          # Keep this as one shell command with AND-chain failure propagation.
          # Reuse one Gradle daemon for the fixture and instrumented app build
          # inside this ephemeral job instead of forking two single-use JVMs.
          script: cd android-transfer && ( ( [ -n "$TARGET_TEST_CLASS" ] && [ "${TARGET_TEST_CLASS%%#*}" != "dev.expository.transfer.RecursiveRealPickerCopyUiTest" ] && [ "$TARGET_TEST_CLASS" != "dev.expository.transfer.DualRecursiveRealPickerCopyUiTest" ] && [ "$TARGET_TEST_CLASS" != "dev.expository.transfer.DualPickerLifecycleIsolationUiTest" ] ) || ( gradle -PwithAndroid=true -PwithPickerFixture=true :testing:documents-provider-fixture:assembleDebug --daemon && adb install -r testing/documents-provider-fixture/build/outputs/apk/debug/documents-provider-fixture-debug.apk ) ) && gradle -PwithAndroid=true ${TARGET_TEST_CLASS:+-Pandroid.testInstrumentationRunnerArguments.class=$TARGET_TEST_CLASS} :app:connectedDebugAndroidTest --daemon
      - name: Require executed instrumentation receipts
        if: success()
        shell: bash
        run: |
          # Avoid a green check from a missing/empty or mismatched test report.
          # Paths and class identifiers are synthetic; never print provider data.
          python3 - <<'PY'
          import os
          from pathlib import Path
          import sys
          from xml.etree import ElementTree as ET

          root = Path("android-transfer/app/build/outputs/androidTest-results/connected")
          results = list(root.rglob("*.xml")) if root.exists() else []
          cases = set()
          skipped = 0
          failures = 0
          for result in results:
              try:
                  document = ET.parse(result)
              except (ET.ParseError, OSError):
                  print("ERROR: Android test report missing or invalid XML", file=sys.stderr)
                  sys.exit(2)
              for case in document.iter("testcase"):
                  if case.find("skipped") is not None or case.find("ignored") is not None:
                      skipped += 1
                      continue
                  if case.find("failure") is not None or case.find("error") is not None:
                      failures += 1
                      continue
                  cases.add((case.get("classname", ""), case.get("name", "")))
          if failures:
              print(f"ERROR: {failures} failing Android testcases; see original report",
                    file=sys.stderr)
              sys.exit(2)
          if not cases:
              print("ERROR: No executed Android instrumentation testcases", file=sys.stderr)
              sys.exit(2)
          selectors = [s for s in os.environ.get("TARGET_TEST_CLASS", "").split(",") if s]
          for selector in selectors:
              classname, _, method = selector.partition("#")
              if not any(c == classname and (not method or name == method) for c, name in cases):
                  # Emit only the reviewed allowlisted selector, never assertion bytes.
                  print(f"ERROR: Missing testcase receipt for {selector}", file=sys.stderr)
                  sys.exit(2)
          print(f"Verified {len(cases)} executed Android testcases across {len(results)} XML reports; "
                f"{skipped} skipped; "
                f"{len(selectors) if selectors else 'full-suite'} selectors accounted for.")
          PY
      - name: Summarize failed tests without disclosing provider content
        if: failure()
        shell: bash
        run: |
          # This trusted main-branch workflow can test an older immutable PR
          # source where newer app-side diagnostics do not yet exist. Keep the
          # diagnostic inline here; never execute a PR-provided log parser.
          python3 - <<'PY'
          import pathlib, re, xml.etree.ElementTree as ET
          root = pathlib.Path("android-transfer/app/build/outputs/androidTest-results/connected")
          safe = re.compile(r"[^A-Za-z0-9_.$#-]")
          frame = re.compile(r"\b([A-Za-z][A-Za-z0-9_]*\.(?:kt|java)):(\d{1,6})\b")
          failed = 0
          for path in sorted(root.rglob("*.xml"))[:300]:
              try:
                  xml = ET.parse(path).getroot()
              except (ET.ParseError, OSError):
                  continue
              for case in xml.iter("testcase"):
                  issue = next((e for e in case if e.tag in ("failure", "error")), None)
                  if issue is None:
                      continue
                  name = safe.sub("_", ".".join((case.attrib.get("classname", "unknown"),
                                                case.attrib.get("name", "unknown"))))[:190]
                  frames = [f"{file}:{line}" for file, line in frame.findall(issue.text or "")][:6]
                  print(f"FAIL {name} at {', '.join(frames) or 'no source frame'}")
                  failed += 1
          print(f"Sanitized failed testcases: {failed}")
          PY
      - name: Publish synthetic report and tested SHA
        if: always()
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          mkdir -p android-transfer/app/build/emulator-pr-provenance
          printf '%s\n' "$SOURCE_SHA" > android-transfer/app/build/emulator-pr-provenance/PR-SHA.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: expository-transfer-pr-${{ github.event.issue.number }}-emulator
          path: |
            android-transfer/app/build/emulator-pr-provenance/PR-SHA.txt
            android-transfer/app/build/reports/androidTests/connected/**
            android-transfer/app/build/outputs/androidTest-results/connected/**
          if-no-files-found: ignore
          retention-days: 5
