name: Expository Transfer scoped SFTP relay acceptance
# E3 uses only generated loopback SSH keys, anonymous disposable temp files,
# and two synthetic authenticated sessions. It never contacts an external host.
on:
  pull_request:
    paths:
      - "android-transfer/adapter/sftp/src/main/kotlin/dev/expository/transfer/sftp/SftpRelayCopy.kt"
      - "android-transfer/adapter/sftp/src/test/kotlin/dev/expository/transfer/sftp/SftpServerLabSuite.kt"
      - ".github/workflows/transfer-sftp-relay-acceptance.yml"
permissions:
  contents: read

# Only superseded automatic PR evidence may be cancelled.
# workflow_dispatch uses its unique run ID; independent manual requests survive.
concurrency:
  group: transfer-sftp-relay-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  synthetic-relay:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.13"
          cache-read-only: true
      - name: Prove pinned localhost SFTP source to second authenticated destination
        working-directory: android-transfer
        run: gradle :adapter:sftp:lab --no-daemon --quiet
