name: Expository Pages Surface Audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    name: Check live Pages source and public paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Compare live Pages index and document public paths
        run: node scripts/pages-audit.cjs
