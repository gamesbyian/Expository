name: Expository Pages Surface Audit
# Source-parity probe uses public HTTPS only; no deployment/write credentials.
# Automatic runs are narrowly limited to trusted-main changes to the audit
# tooling itself. Publisher/content updates may precede Pages propagation and
# must still be qualified by a separately dispatched post-deployment audit.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages-surface-audit.yml'
      - 'scripts/pages-audit.cjs'
permissions:
  contents: read
jobs:
  audit:
    name: Check live Pages source and public paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Compare live Pages index and document public paths
        run: node scripts/pages-audit.cjs
